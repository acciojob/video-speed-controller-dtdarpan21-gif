<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wrapper">
    <video class="flex" width="765" height="430" src="http://clips.vorwaerts-gmbh.de/VfE_html5.mp4" controls></video>
    <div class="speed">
      <div class="speed-bar"><dic class ="progress__filled"></div>1×</div>
    </div>
	<button class ="player__button toggle" title="Toggle Play">►</button>
		<button class ="player__button " data-skip="-10" >«10s>►</button>
		<button class ="player__button "  data-skip ="25">25s »</button>
	<input type = "range" name="volume" min="0" max ="1" step="0.05" value="0.75 title="Volume">
	<input type = "range" name="playbackspeed" min="0.5" max ="2" step="0.1" value="1" title="Playback speed">
	
  </div>

<script  src="./script.js">
  //Your code goes here
</script>
</body>
</html>
